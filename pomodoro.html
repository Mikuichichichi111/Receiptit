<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Pomodoro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
<canvas id="confetti-canvas"></canvas>

<nav class="navbar">
    <div class="navbar-brand" onclick="location.href='index.html'">RECEIPTIT</div>
    <div class="navbar-actions">
        <a href="inventory.html" class="navbar-link">🎒</a><a href="sticker-world.html" class="navbar-link">🌍</a>
        <a href="friends.html" class="navbar-link">👥</a><a href="trades.html" class="navbar-link">🔄</a>
        <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
    </div>
</nav>

<div class="main-content">
    <div class="timer-container">
        <div class="timer-circle-wrapper">
            <svg class="timer-circle-svg" viewBox="0 0 260 260">
                <defs><linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#6366f1"/><stop offset="100%" style="stop-color:#8b5cf6"/></linearGradient></defs>
                <circle class="timer-circle-bg" cx="130" cy="130" r="120"/>
                <circle class="timer-circle-progress" id="timer-progress" cx="130" cy="130" r="120"/>
            </svg>
            <div class="timer-display"><div class="timer-time" id="timer-display">25:00</div><div class="timer-label" id="timer-label">Focus time</div><div class="timer-mode-badge" id="timer-mode">FOCUS</div></div>
        </div>
        <div class="timer-controls">
            <button class="timer-btn btn-secondary" onclick="resetTimer()">🔄</button>
            <button class="timer-btn btn-play" id="btn-play" onclick="toggleTimer()">▶️</button>
            <button class="timer-btn btn-secondary" onclick="skipTimer()">⏭️</button>
        </div>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" data-mode="focus" data-time="25" onclick="setMode(this)">🍅 25min</button>
        <button class="mode-btn" data-mode="focus" data-time="15" onclick="setMode(this)">🍅 15min</button>
        <button class="mode-btn" data-mode="short-break" data-time="5" onclick="setMode(this)">☕ 5min</button>
        <button class="mode-btn" data-mode="long-break" data-time="15" onclick="setMode(this)">🌴 15min</button>
    </div>

    <div class="card"><h3>⚙️ Temps personnalisé</h3>
        <div style="display:flex;gap:8px;align-items:center;"><input type="number" id="custom-minutes" value="25" min="1" max="120" style="flex:1;padding:12px;border-radius:12px;border:2px solid rgba(139,92,246,0.15);font-family:'Space Mono',monospace;font-size:1.2rem;text-align:center;"><span>min</span><button class="btn-small" onclick="setCustomTime()">Appliquer</button></div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;"><button class="btn-small outline" onclick="quickSet(1)">1</button><button class="btn-small outline" onclick="quickSet(5)">5</button><button class="btn-small outline" onclick="quickSet(15)">15</button><button class="btn-small outline" onclick="quickSet(25)">25</button><button class="btn-small outline" onclick="quickSet(45)">45</button><button class="btn-small outline" onclick="quickSet(60)">60</button></div>
    </div>

    <div class="card"><h3>📚 Matière (optionnel)</h3>
        <div class="subject-grid">
            <div class="subject-chip" data-subject="Maths" onclick="selectSubject(this)"><span class="chip-icon">📐</span>Maths</div>
            <div class="subject-chip" data-subject="Physique" onclick="selectSubject(this)"><span class="chip-icon">⚛️</span>Physique</div>
            <div class="subject-chip" data-subject="Chimie" onclick="selectSubject(this)"><span class="chip-icon">🧪</span>Chimie</div>
            <div class="subject-chip" data-subject="Français" onclick="selectSubject(this)"><span class="chip-icon">📖</span>Français</div>
            <div class="subject-chip" data-subject="Histoire" onclick="selectSubject(this)"><span class="chip-icon">🏛️</span>Histoire</div>
            <div class="subject-chip" data-subject="Anglais" onclick="selectSubject(this)"><span class="chip-icon">🇬🇧</span>Anglais</div>
            <div class="subject-chip" data-subject="SVT" onclick="selectSubject(this)"><span class="chip-icon">🌿</span>SVT</div>
            <div class="subject-chip" data-subject="Info" onclick="selectSubject(this)"><span class="chip-icon">💻</span>Info</div>
            <div class="subject-chip" data-subject="Philosophie" onclick="selectSubject(this)"><span class="chip-icon">🤔</span>Philo</div>
        </div>
        <div class="custom-subject"><input type="text" id="custom-subject-input" placeholder="Autre..." maxlength="20"><button onclick="addCustomSubject()">OK</button></div>
    </div>

    <div class="card"><h3>📝 Note</h3><textarea id="session-note" placeholder="Ce que tu as travaillé..." maxlength="200" style="width:100%;padding:12px;border-radius:12px;border:2px solid rgba(139,92,246,0.15);font-family:'Outfit',sans-serif;font-size:0.9rem;resize:none;min-height:60px;outline:none;"></textarea></div>

    <div class="mini-stats">
        <div class="mini-stat"><div class="ms-value" id="stat-today">0</div><div class="ms-label">Aujourd'hui</div></div>
        <div class="mini-stat"><div class="ms-value" id="stat-week">0</div><div class="ms-label">Semaine</div></div>
        <div class="mini-stat"><div class="ms-value" id="stat-total">0</div><div class="ms-label">Total</div></div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
    <a href="pomodoro.html" class="nav-item active"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
    <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
    <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
</nav>

<div class="modal-overlay" id="completion-modal"><div class="modal-content"><span class="modal-icon">🎉</span><div class="modal-title">Terminé !</div><div class="modal-subtitle" id="modal-subtitle">Bien joué !</div><div class="modal-points" id="modal-points-text">+25 pts</div><button class="modal-btn" onclick="closeModal()">Continuer</button></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://fonraobtmkaallsjxtoj.supabase.co';
const SUPABASE_KEY='sb_publishable_QxU-Ql1Mux18PlLjGady5g_gwkTCKSH';
let supabase=null,supabaseOnline=false;
(async function(){try{supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);supabaseOnline=true;}catch(e){}})();

const currentUser=localStorage.getItem('receiptit_logged_user');
if(!currentUser)location.href='login.html';

let state={points:0,sessions:[],totalSessions:0,streak:0,userId:localStorage.getItem('receiptit_user_id')||'user_'+Math.random().toString(36).substr(2,9)+'_'+Date.now()};
let ts={timeLeft:25*60,totalTime:25*60,isRunning:false,mode:'focus',interval:null,selectedSubject:null};
const CIRC=2*Math.PI*120;

function localSave(){localStorage.setItem('receiptit_state_'+currentUser,JSON.stringify(state));}
function localLoad(){let s=localStorage.getItem('receiptit_state_'+currentUser);if(s)try{state={...state,...JSON.parse(s)};}catch(e){}}
async function saveToDB(){localSave();if(!supabaseOnline)return;try{await supabase.from('receiptit_users').upsert({user_id:state.userId,username:currentUser,points:state.points,sessions:state.sessions,total_sessions:state.totalSessions,streak:state.streak,updated_at:new Date().toISOString()},{onConflict:'username'});}catch(e){}}
async function loadFromDB(){if(!supabaseOnline){localLoad();return false;}try{let{data}=await supabase.from('receiptit_users').select('*').eq('username',currentUser).single();if(data){state.points=data.points||0;state.sessions=data.sessions||[];state.totalSessions=data.total_sessions||0;state.streak=data.streak||0;state.userId=data.user_id||state.userId;localSave();return true;}}catch(e){}localLoad();return false;}
function getStreakMultiplier(){return state.streak<=0?1.0:Math.min(1+(state.streak*0.1),3.0);}
function calculateStreak(){let ss=state.sessions;if(!ss.length)return 0;let dates=[...new Set(ss.map(s=>new Date(s.date).toDateString()))].sort((a,b)=>new Date(b)-new Date(a));let today=new Date().toDateString(),yesterday=new Date(Date.now()-86400000).toDateString();if(dates[0]!==today&&dates[0]!==yesterday)return 0;let st=0,check=new Date(dates[0]);for(let d of dates){if(d===check.toDateString()){st++;check.setDate(check.getDate()-1);}else if(st===0&&d===yesterday){st++;check.setDate(check.getDate()-1);}else break;}return st;}

function updateTimerDisplay(){let m=Math.floor(ts.timeLeft/60),s=ts.timeLeft%60;document.getElementById('timer-display').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');document.getElementById('timer-progress').style.strokeDashoffset=CIRC*(1-ts.timeLeft/ts.totalTime);}
function toggleTimer(){let btn=document.getElementById('btn-play');if(ts.isRunning){clearInterval(ts.interval);ts.isRunning=false;btn.innerHTML='▶️';}else{if(ts.timeLeft<=0)return;ts.isRunning=true;btn.innerHTML='⏸️';let start=Date.now(),initial=ts.timeLeft;ts.interval=setInterval(()=>{ts.timeLeft=Math.max(0,initial-Math.floor((Date.now()-start)/1000));updateTimerDisplay();if(ts.timeLeft<=0)completeTimer();},200);}}
function resetTimer(){clearInterval(ts.interval);ts.isRunning=false;ts.timeLeft=ts.totalTime;updateTimerDisplay();document.getElementById('btn-play').innerHTML='▶️';}
function skipTimer(){clearInterval(ts.interval);ts.isRunning=false;ts.timeLeft=0;updateTimerDisplay();completeTimer();}
function setMode(btn){clearInterval(ts.interval);ts.isRunning=false;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');ts.mode=btn.dataset.mode;ts.totalTime=parseInt(btn.dataset.time)*60;ts.timeLeft=ts.totalTime;document.getElementById('custom-minutes').value=btn.dataset.time;let labels={focus:{label:'Focus time',badge:'FOCUS'},'short-break':{label:'Pause courte',badge:'PAUSE'},'long-break':{label:'Pause longue',badge:'PAUSE'}};document.getElementById('timer-label').textContent=labels[ts.mode]?.label||'Focus';document.getElementById('timer-mode').textContent=labels[ts.mode]?.badge||'FOCUS';updateTimerDisplay();document.getElementById('btn-play').innerHTML='▶️';}
function setCustomTime(){let min=parseInt(document.getElementById('custom-minutes').value);if(!min||min<1||min>120){showToast('⚠️ 1-120 min');return;}clearInterval(ts.interval);ts.isRunning=false;ts.totalTime=min*60;ts.timeLeft=ts.totalTime;ts.mode='focus';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));document.getElementById('timer-label').textContent='Focus '+min+'min';document.getElementById('timer-mode').textContent='CUSTOM';updateTimerDisplay();document.getElementById('btn-play').innerHTML='▶️';}
function quickSet(m){document.getElementById('custom-minutes').value=m;setCustomTime();}
function selectSubject(chip){document.querySelectorAll('.subject-chip').forEach(c=>c.classList.remove('active'));if(ts.selectedSubject===chip.dataset.subject){ts.selectedSubject=null;}else{chip.classList.add('active');ts.selectedSubject=chip.dataset.subject;}}
function addCustomSubject(){let v=document.getElementById('custom-subject-input').value.trim();if(!v)return;ts.selectedSubject=v;document.querySelectorAll('.subject-chip').forEach(c=>c.classList.remove('active'));showToast('✅ '+v);}

async function completeTimer(){clearInterval(ts.interval);ts.isRunning=false;document.getElementById('btn-play').innerHTML='▶️';
    if(ts.mode==='focus'){let mult=getStreakMultiplier(),bp=Math.round(ts.totalTime/60),fp=Math.round(bp*mult);state.points+=fp;state.totalSessions++;
        state.sessions.push({type:'pomodoro',label:'Focus '+Math.round(ts.totalTime/60)+'min',points:fp,basePoints:bp,multiplier:mult,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),subject:ts.selectedSubject,note:document.getElementById('session-note').value.trim()||null,date:new Date().toISOString()});
        state.streak=calculateStreak();await saveToDB();
        document.getElementById('modal-subtitle').textContent=ts.selectedSubject?'Focus sur '+ts.selectedSubject+' ✅':'Bien joué !';
        document.getElementById('modal-points-text').textContent='+'+fp+' pts'+(mult>1?' (×'+mult.toFixed(1)+' 🔥)':'');
        document.getElementById('completion-modal').classList.add('active');launchConfetti();document.getElementById('nav-points').textContent=state.points;updateStats();}
    else{showToast('Pause terminée !');document.querySelector('[data-mode="focus"][data-time="25"]')?.click();}}
function closeModal(){document.getElementById('completion-modal').classList.remove('active');document.getElementById('session-note').value='';resetTimer();}
function launchConfetti(){let c=document.getElementById('confetti-canvas'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let p=[],cols=['#8b5cf6','#6366f1','#fbbf24','#34d399'];for(let i=0;i<60;i++)p.push({x:c.width/2,y:c.height/2,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12-4,s:Math.random()*6+3,cl:cols[Math.floor(Math.random()*cols.length)],l:1,d:Math.random()*0.012+0.008});(function a(){ctx.clearRect(0,0,c.width,c.height);let al=false;p.forEach(p=>{if(p.l>0){al=true;p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l-=p.d;ctx.globalAlpha=p.l;ctx.fillStyle=p.cl;ctx.fillRect(p.x,p.y,p.s,p.s);}});if(al)requestAnimationFrame(a);})();}
function updateStats(){let today=new Date().toDateString();document.getElementById('stat-today').textContent=state.sessions.filter(s=>{try{return new Date(s.date).toDateString()===today&&s.type==='pomodoro';}catch(e){return false;}}).length;let wa=new Date();wa.setDate(wa.getDate()-7);document.getElementById('stat-week').textContent=state.sessions.filter(s=>{try{return new Date(s.date)>wa&&s.type==='pomodoro';}catch(e){return false;}}).length;document.getElementById('stat-total').textContent=state.sessions.filter(s=>s.type==='pomodoro').length;}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

document.addEventListener('DOMContentLoaded',async()=>{let loaded=await loadFromDB();if(!loaded)localLoad();document.getElementById('nav-points').textContent=state.points;updateStats();updateTimerDisplay();});
</script>
</body>
</html>
