<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Inventaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="navbar">
        <div class="navbar-brand" onclick="location.href='index.html'" style="cursor:pointer;">RECEIPTIT</div>
        <div class="navbar-actions">
            <a href="inventory.html" class="navbar-link" style="color:var(--accent);">🎒</a>
            <a href="sticker-world.html" class="navbar-link">🌍</a>
            <a href="friends.html" class="navbar-link">👥</a>
            <a href="trades.html" class="navbar-link">🔄</a>
            <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
        </div>
    </nav>

    <div class="main-content">
        <div class="filter-tabs">
            <div class="filter-tab active" data-filter="all" onclick="filterItems('all')">📦 Tout</div>
            <div class="filter-tab" data-filter="common" onclick="filterItems('common')">⭐ Commun</div>
            <div class="filter-tab" data-filter="rare" onclick="filterItems('rare')">🔵 Rare</div>
            <div class="filter-tab" data-filter="epic" onclick="filterItems('epic')">🟣 Épique</div>
            <div class="filter-tab" data-filter="legendary" onclick="filterItems('legendary')">🟠 Légendaire</div>
            <div class="filter-tab" data-filter="divine" onclick="filterItems('divine')">🔴 Divin</div>
        </div>

        <div class="inv-stats">
            <div class="inv-stat"><div class="is-dot" style="background:var(--rarity-common);"></div><span class="is-value" id="count-common">0</span><span class="is-label">Commun</span></div>
            <div class="inv-stat"><div class="is-dot" style="background:var(--rarity-rare);"></div><span class="is-value" id="count-rare">0</span><span class="is-label">Rare</span></div>
            <div class="inv-stat"><div class="is-dot" style="background:var(--rarity-epic);"></div><span class="is-value" id="count-epic">0</span><span class="is-label">Épique</span></div>
            <div class="inv-stat"><div class="is-dot" style="background:var(--rarity-legendary);box-shadow:0 0 6px var(--rarity-legendary);"></div><span class="is-value" id="count-legendary">0</span><span class="is-label">Lég.</span></div>
            <div class="inv-stat"><div class="is-dot" style="background:var(--rarity-divine);box-shadow:0 0 6px var(--rarity-divine);"></div><span class="is-value" id="count-divine">0</span><span class="is-label">Divin</span></div>
        </div>

        <div class="inventory-grid" id="inventory-grid">
            <div class="empty-state" style="grid-column:span 3;"><div class="empty-icon">🎒</div><h3>Inventaire vide</h3><p>Ouvre des packs !</p></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
        <a href="pomodoro.html" class="nav-item"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
        <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
        <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
    </nav>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content"><span class="modal-icon" id="modal-icon">🎁</span><div class="modal-name" id="modal-name">Item</div><div class="modal-rarity" id="modal-rarity">Rarity</div><div class="modal-count" id="modal-count">x1</div><button class="modal-btn" onclick="closeModal()">OK</button></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://fonraobtmkaallsjxtoj.supabase.co';
const SUPABASE_KEY='sb_publishable_QxU-Ql1Mux18PlLjGady5g_gwkTCKSH';
let supabase=null,supabaseOnline=false;
(async function(){try{supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);supabaseOnline=true}catch(e){supabaseOnline=false}})();

const currentUser=localStorage.getItem('receiptit_logged_user');
if(!currentUser)location.href='login.html';

let state={points:0,inventory:{}};
let cf='all';
const RC={common:'#94a3b8',rare:'#60a5fa',epic:'#a78bfa',legendary:'#fbbf24',divine:'#f472b6'};
const RN={common:'Commun',rare:'Rare',epic:'Épique',legendary:'Légendaire',divine:'Divin'};
const RO={divine:5,legendary:4,epic:3,rare:2,common:1};

async function loadData(){
    if(supabaseOnline){
        try{let{data}=await supabase.from('receiptit_users').select('points,inventory').eq('username',currentUser).single();
        if(data){state.points=data.points||0;state.inventory=data.inventory||{};localStorage.setItem('receiptit_state_'+currentUser,JSON.stringify(state));return;}}catch(e){}
    }
    let s=localStorage.getItem('receiptit_state_'+currentUser);if(s)try{state={...state,...JSON.parse(s)};}catch(e){}
}

function updateStats(){let c={common:0,rare:0,epic:0,legendary:0,divine:0};Object.values(state.inventory).forEach(i=>{if(c[i.rarity]!==undefined)c[i.rarity]+=i.count||0;});Object.keys(c).forEach(r=>{let el=document.getElementById('count-'+r);if(el)el.textContent=c[r];});}
function filterItems(f){cf=f;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));document.querySelector('[data-filter="'+f+'"]')?.classList.add('active');render();}
function render(){let g=document.getElementById('inventory-grid');let items=Object.entries(state.inventory).map(([k,v])=>({key:k,...v}));let filtered=cf==='all'?items:items.filter(i=>i.rarity===cf);if(!filtered.length){g.innerHTML='<div class="empty-state" style="grid-column:span 3;"><div class="empty-icon">🎒</div><h3>'+(cf==='all'?'Inventaire vide':'Aucun item')+'</h3><p>Ouvre des packs !</p></div>';updateStats();return;}filtered.sort((a,b)=>(RO[b.rarity]-RO[a.rarity])||(b.count||0)-(a.count||0));g.innerHTML=filtered.map(item=>'<div class="inv-item" onclick="showDetail(\''+(item.n||item.name)+'\',\''+item.rarity+'\',\''+(item.i||item.icon)+'\','+(item.count||1)+')"><div class="item-rarity-bar" style="background:'+RC[item.rarity]+';"></div><span class="item-icon">'+(item.i||item.icon)+'</span><div class="item-name">'+(item.n||item.name)+'</div><div class="item-rarity" style="color:'+RC[item.rarity]+'">'+RN[item.rarity]+'</div><span class="item-count">x'+(item.count||1)+'</span></div>').join('');updateStats();}
function showDetail(name,rarity,icon,count){document.getElementById('modal-icon').textContent=icon;document.getElementById('modal-name').textContent=name;document.getElementById('modal-name').style.color=RC[rarity];document.getElementById('modal-rarity').textContent=RN[rarity];document.getElementById('modal-rarity').style.color=RC[rarity];document.getElementById('modal-count').textContent='Tu en as '+count;document.getElementById('modal-overlay').classList.add('active');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('active');}

document.addEventListener('DOMContentLoaded',async()=>{await loadData();document.getElementById('nav-points').textContent=state.points;updateStats();render();});
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal();});
</script>
</body>
</html>
