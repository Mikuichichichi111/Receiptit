<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Échanges</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="navbar">
        <div class="navbar-brand" onclick="location.href='index.html'" style="cursor:pointer;">RECEIPTIT</div>
        <div class="navbar-actions">
            <a href="inventory.html" class="navbar-link">🎒</a>
            <a href="sticker-world.html" class="navbar-link">🌍</a>
            <a href="friends.html" class="navbar-link">👥</a>
            <a href="trades.html" class="navbar-link" style="color:var(--accent);">🔄</a>
            <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
        </div>
    </nav>

    <div class="main-content">
        <div class="section-title">🔄 Échanges de stickers</div>

        <!-- ENVOYER UN STICKER -->
        <div class="card">
            <h3>📤 Envoyer un sticker à un ami</h3>
            <div class="input-group"><label>Destinataire</label><select id="trade-friend"></select></div>
            <div class="input-group"><label>Sticker</label><select id="trade-sticker"></select></div>
            <div class="input-group"><label>Message</label><input type="text" id="trade-msg" placeholder="Un petit mot..." maxlength="100"></div>
            <button class="btn-primary" onclick="sendSticker()">🎁 Envoyer</button>
        </div>

        <!-- DEMANDES REÇUES -->
        <div class="section-title">📩 Reçus (<span id="received-count">0</span>)</div>
        <div id="received-trades"></div>

        <!-- ENVOYÉS -->
        <div class="section-title">📤 Envoyés (<span id="sent-count">0</span>)</div>
        <div id="sent-trades"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
        <a href="pomodoro.html" class="nav-item"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
        <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
        <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
    </nav>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script>
        const currentUser = localStorage.getItem('receiptit_logged_user');
        if (!currentUser) location.href = 'login.html';

        let myState = { points:0,inventory:{},friends:[] };
        let trades = JSON.parse(localStorage.getItem('receiptit_trades')||'[]');

        function loadState() {
            const s = localStorage.getItem('receiptit_state_'+currentUser);
            if (s) try { myState = {...myState,...JSON.parse(s)}; } catch(e) {}
        }

        function saveState() {
            localStorage.setItem('receiptit_state_'+currentUser, JSON.stringify({...JSON.parse(localStorage.getItem('receiptit_state_'+currentUser)||'{}'), inventory:myState.inventory}));
        }

        function saveTrades() { localStorage.setItem('receiptit_trades', JSON.stringify(trades)); }

        function populateSelects() {
            const friends = myState.friends||[];
            document.getElementById('trade-friend').innerHTML = friends.length ? friends.map(f => `<option value="${f}">@${f}</option>`).join('') : '<option>Aucun ami</option>';

            const items = Object.entries(myState.inventory).map(([k,v]) => ({key:k,...v}));
            document.getElementById('trade-sticker').innerHTML = items.length ? items.map(i => `<option value="${i.key.replace(/"/g,'&quot;')}">${i.i||i.icon} ${i.n||i.name} (x${i.count})</option>`).join('') : '<option>Pas de sticker</option>';
        }

        function sendSticker() {
            const to = document.getElementById('trade-friend').value;
            const key = document.getElementById('trade-sticker').value;
            const msg = document.getElementById('trade-msg').value.trim();
            if (!to || to === 'Aucun ami') { showToast('⚠️ Choisis un ami !'); return; }
            if (!key || key === 'Pas de sticker') { showToast('⚠️ Choisis un sticker !'); return; }

            const item = myState.inventory[key];
            if (!item || item.count < 1) { showToast('⚠️ Pas assez !'); return; }

            item.count--;
            if (item.count <= 0) delete myState.inventory[key];

            trades.push({ id:Date.now(), from:currentUser, to, stickerKey:key, stickerName:item.n||item.name, stickerIcon:item.i||item.icon, stickerRarity:item.rarity, message:msg||'🎁 Pour toi !', status:'pending', date:new Date().toISOString() });
            saveState(); saveTrades();
            document.getElementById('trade-msg').value = '';
            showToast('✅ Envoyé à @'+to);
            renderAll(); populateSelects();
        }

        function acceptTrade(id) {
            const t = trades.find(tr => tr.id === id);
            if (!t || t.to !== currentUser) return;
            const key = t.stickerKey;
            if (!myState.inventory[key]) myState.inventory[key] = { n:t.stickerName, i:t.stickerIcon, rarity:t.stickerRarity, count:0 };
            myState.inventory[key].count++;
            trades = trades.filter(tr => tr.id !== id);
            saveState(); saveTrades();
            showToast('✅ Reçu !');
            renderAll();
        }

        function rejectTrade(id) {
            const t = trades.find(tr => tr.id === id);
            if (!t) return;
            const senderState = JSON.parse(localStorage.getItem('receiptit_state_'+t.from)||'{}');
            if (!senderState.inventory) senderState.inventory = {};
            if (!senderState.inventory[t.stickerKey]) senderState.inventory[t.stickerKey] = { n:t.stickerName, i:t.stickerIcon, rarity:t.stickerRarity, count:0 };
            senderState.inventory[t.stickerKey].count++;
            localStorage.setItem('receiptit_state_'+t.from, JSON.stringify(senderState));
            trades = trades.filter(tr => tr.id !== id);
            saveTrades();
            showToast('❌ Refusé');
            renderAll();
        }

        function renderAll() {
            const received = trades.filter(t => t.to === currentUser);
            const sent = trades.filter(t => t.from === currentUser);

            document.getElementById('received-count').textContent = received.length;
            document.getElementById('received-trades').innerHTML = received.length ? received.map(t => `
                <div class="card" style="display:flex;align-items:center;gap:12px;">
                    <span style="font-size:2rem;">${t.stickerIcon}</span>
                    <div style="flex:1;"><strong>${t.stickerName}</strong><br><span style="font-size:0.7rem;color:var(--text-dim);">De @${t.from} · ${t.message}</span></div>
                    <button class="btn-small" onclick="acceptTrade(${t.id})">✅</button>
                    <button class="btn-small outline" onclick="rejectTrade(${t.id})" style="border-color:var(--danger);color:var(--danger);">❌</button>
                </div>`).join('') : '<p style="color:var(--text-dim);font-size:0.8rem;">Aucune.</p>';

            document.getElementById('sent-count').textContent = sent.length;
            document.getElementById('sent-trades').innerHTML = sent.length ? sent.map(t => `
                <div class="card" style="display:flex;align-items:center;gap:12px;opacity:0.7;">
                    <span style="font-size:2rem;">${t.stickerIcon}</span>
                    <div style="flex:1;"><strong>${t.stickerName}</strong><br><span style="font-size:0.7rem;color:var(--text-dim);">À @${t.to} · ${t.message}</span></div>
                    <span style="font-size:0.7rem;color:var(--text-dim);">En attente</span>
                </div>`).join('') : '<p style="color:var(--text-dim);font-size:0.8rem;">Aucune.</p>';
        }

        function showToast(msg) { const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500); }

        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            document.getElementById('nav-points').textContent = myState.points;
            populateSelects(); renderAll();
        });
    </script>
</body>
</html>
