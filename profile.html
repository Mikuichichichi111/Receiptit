<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>

<nav class="navbar">
    <div class="navbar-brand" onclick="location.href='index.html'">RECEIPTIT</div>
    <div class="navbar-actions">
        <a href="inventory.html" class="navbar-link">🎒</a><a href="sticker-world.html" class="navbar-link">🌍</a>
        <a href="friends.html" class="navbar-link">👥</a><a href="trades.html" class="navbar-link">🔄</a>
        <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
    </div>
</nav>

<div class="main-content">
    <div class="profile-header">
        <div class="profile-avatar-container">
            <div class="profile-avatar" onclick="document.getElementById('pic-upload').click()" style="cursor:pointer;">
                <span id="avatar-emoji" style="font-size:2.5rem;">👤</span>
                <img id="avatar-img" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
            </div>
            <input type="file" id="pic-upload" accept="image/*" style="display:none;" onchange="uploadPic(event)">
            <div class="profile-avatar-decoration top-right" id="sticker-tr"></div>
            <div class="profile-avatar-decoration bottom-left" id="sticker-bl"></div>
        </div>
        <div class="profile-name" id="profile-name">User</div>
        <div class="profile-username">@<span id="profile-username">user</span></div>
        <div class="follow-stats">
            <span><strong id="followers-count">0</strong> followers</span>
            <span><strong id="following-count">0</strong> following</span>
            <span><strong id="friends-count">0</strong> amis</span>
        </div>
        <div class="profile-points"><span>⭐</span><span id="profile-points">0 pts</span></div>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <span style="background:var(--accent-pale);color:var(--accent);padding:4px 10px;border-radius:8px;font-size:0.7rem;">📚 <span id="psessions">0</span></span>
            <span style="background:#fef3c7;color:#d97706;padding:4px 10px;border-radius:8px;font-size:0.7rem;">🔥 <span id="pstreak">0</span>j</span>
            <span style="background:#d1fae5;color:#059669;padding:4px 10px;border-radius:8px;font-size:0.7rem;">🎁 <span id="ppacks">0</span></span>
        </div>
    </div>

    <div class="card"><h2>🏷️ Stickers équipés (max 2)</h2><div class="sticker-grid" id="equipped-stickers"></div><div class="empty-state" id="no-stickers" style="display:none;"><p>Pas de stickers.</p></div></div>
    <div class="card"><h2>📊 Stats</h2>
        <div class="stats-row">
            <div class="stat-card"><span class="stat-icon">📚</span><div class="stat-value" id="detail-lessons">0</div><div class="stat-label">Leçons</div></div>
            <div class="stat-card"><span class="stat-icon">✏️</span><div class="stat-value" id="detail-exercises">0</div><div class="stat-label">Exercices</div></div>
            <div class="stat-card"><span class="stat-icon">⏱️</span><div class="stat-value" id="detail-pomodoros">0</div><div class="stat-label">Pomodoros</div></div>
        </div>
    </div>
    <button class="btn-primary" style="background:var(--danger);margin-top:8px;" onclick="logout()">🚪 Déconnexion</button>
</div>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
    <a href="pomodoro.html" class="nav-item"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
    <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
    <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
</nav>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://fonraobtmkaallsjxtoj.supabase.co';
const SUPABASE_KEY='sb_publishable_QxU-Ql1Mux18PlLjGady5g_gwkTCKSH';
const IMGBB_KEY='fcf75efb4dcf86cc32df14a55969f334';
let supabase=null;
(async function(){try{supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);console.log('✅ Supabase OK');}catch(e){console.error('❌ Supabase error:',e);}})();

const currentUser=localStorage.getItem('receiptit_logged_user');
if(!currentUser)location.href='login.html';

let state={points:0,sessions:[],inventory:{},packsOpened:0,totalSessions:0,streak:0,equippedStickers:[],stickerWall:[],avatarEmoji:'👤',profilePic:null,friends:[],followers:[],following:[],userId:localStorage.getItem('receiptit_user_id')||'user_'+Math.random().toString(36).substr(2,9)+'_'+Date.now()};

async function saveData(){localStorage.setItem('receiptit_state_'+currentUser,JSON.stringify(state));try{let{error}=await supabase.from('receiptit_users').update({points:state.points,sessions:state.sessions,inventory:state.inventory,packs_opened:state.packsOpened,total_sessions:state.totalSessions,streak:state.streak,equipped_stickers:state.equippedStickers,sticker_wall:state.stickerWall,avatar_emoji:state.avatarEmoji,profile_pic:state.profilePic,friends:state.friends,followers:state.followers,following:state.following,updated_at:new Date().toISOString()}).eq('username',currentUser);if(error)console.error('Save error:',error);else console.log('✅ Saved:',state.points,'pts');}catch(e){console.error('Save exception:',e);}}
async function loadData(){try{let{data,error}=await supabase.from('receiptit_users').select('*').eq('username',currentUser).single();if(!error&&data){state.points=data.points||0;state.sessions=data.sessions||[];state.inventory=data.inventory||{};state.packsOpened=data.packs_opened||0;state.totalSessions=data.total_sessions||0;state.streak=data.streak||0;state.equippedStickers=data.equipped_stickers||[];state.stickerWall=data.sticker_wall||[];state.avatarEmoji=data.avatar_emoji||'👤';state.profilePic=data.profile_pic||null;state.friends=data.friends||[];state.followers=data.followers||[];state.following=data.following||[];state.userId=data.user_id||state.userId;console.log('✅ Loaded:',state.points,'pts');return;}}catch(e){console.error('Load error:',e);}let s=localStorage.getItem('receiptit_state_'+currentUser);if(s)try{state={...state,...JSON.parse(s)};console.log('⚠️ Loaded from localStorage');}catch(e){}}

function updateUI(){
    document.getElementById('nav-points').textContent=state.points;document.getElementById('profile-points').textContent=state.points+' pts';
    document.getElementById('profile-name').textContent=currentUser;document.getElementById('profile-username').textContent=currentUser;
    document.getElementById('followers-count').textContent=(state.followers||[]).length;document.getElementById('following-count').textContent=(state.following||[]).length;
    document.getElementById('friends-count').textContent=(state.friends||[]).length;
    document.getElementById('psessions').textContent=state.totalSessions;document.getElementById('pstreak').textContent=state.streak;document.getElementById('ppacks').textContent=state.packsOpened;
    document.getElementById('detail-lessons').textContent=state.sessions.filter(s=>s.type==='lesson').length;
    document.getElementById('detail-exercises').textContent=state.sessions.filter(s=>s.type==='exercise').length;
    document.getElementById('detail-pomodoros').textContent=state.sessions.filter(s=>s.type==='pomodoro').length;
    if(state.profilePic){document.getElementById('avatar-img').src=state.profilePic;document.getElementById('avatar-img').style.display='block';document.getElementById('avatar-emoji').style.display='none';}
    else{document.getElementById('avatar-emoji').textContent=state.avatarEmoji||'👤';document.getElementById('avatar-img').style.display='none';document.getElementById('avatar-emoji').style.display='block';}
    renderStickers();updateDecorations();
}

function renderStickers(){let c=document.getElementById('equipped-stickers');let items=Object.entries(state.inventory).map(([k,v])=>({key:k,...v}));if(!items.length){document.getElementById('no-stickers').style.display='block';c.innerHTML='';return;}document.getElementById('no-stickers').style.display='none';c.innerHTML=items.map(item=>{let eq=(state.equippedStickers||[]).includes(item.key);return'<div class="sticker-item '+(eq?'equipped':'')+'" onclick="toggleSticker(\''+item.key.replace(/'/g,"\\'")+'\')"><span style="font-size:2rem;">'+(item.i||item.icon)+'</span><span class="sticker-count">'+(item.n||item.name)+'</span><span style="font-size:0.6rem;">x'+(item.count||1)+'</span>'+(eq?'<span class="equip-badge">✅</span>':'')+'</div>';}).join('');}
function toggleSticker(key){if(!state.equippedStickers)state.equippedStickers=[];let idx=state.equippedStickers.indexOf(key);if(idx>-1)state.equippedStickers.splice(idx,1);else{if(state.equippedStickers.length>=2){showToast('⚠️ Max 2 stickers !');return;}state.equippedStickers.push(key);}saveData();renderStickers();updateDecorations();}
function updateDecorations(){document.getElementById('sticker-tr').textContent='';document.getElementById('sticker-bl').textContent='';if(state.equippedStickers?.length>0){let i1=state.inventory[state.equippedStickers[0]];if(i1)document.getElementById('sticker-tr').textContent=i1.i||i1.icon;}if(state.equippedStickers?.length>1){let i2=state.inventory[state.equippedStickers[1]];if(i2)document.getElementById('sticker-bl').textContent=i2.i||i2.icon;}}
async function uploadPic(e){let file=e.target.files[0];if(!file)return;if(file.size>5e6){showToast('⚠️ Max 5 Mo');return;}let fd=new FormData();fd.append('image',file);try{let r=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});let d=await r.json();if(d.success){state.profilePic=d.data.url;await saveData();updateUI();showToast('✅ Photo mise à jour !');}else{showToast('❌ Erreur');}}catch(e){showToast('❌ Erreur');}}
function logout(){localStorage.setItem('receiptit_last_logout_'+currentUser,new Date().toISOString());localStorage.removeItem('receiptit_logged_user');location.href='login.html';}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

document.addEventListener('DOMContentLoaded',async()=>{await loadData();updateUI();});
</script>
</body>
</html>
