<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Profil</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="navbar">
        <div class="navbar-brand" onclick="location.href='index.html'" style="cursor:pointer;">RECEIPTIT</div>
        <div class="navbar-actions">
            <a href="inventory.html" class="navbar-link">🎒</a>
            <a href="sticker-world.html" class="navbar-link">🌍</a>
            <a href="friends.html" class="navbar-link">👥</a>
            <a href="trades.html" class="navbar-link">🔄</a>
            <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
        </div>
    </nav>

    <div class="main-content">
        <div class="profile-header">
            <div class="profile-avatar-container">
                <div class="profile-avatar" onclick="document.getElementById('pic-upload').click()" style="cursor:pointer;">
                    <span id="avatar-emoji" style="font-size:2.5rem;">👤</span>
                    <img id="avatar-img" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
                </div>
                <input type="file" id="pic-upload" accept="image/*" style="display:none;" onchange="uploadProfilePic(event)">
                <div class="profile-avatar-decoration top-right" id="sticker-tr"></div>
                <div class="profile-avatar-decoration bottom-left" id="sticker-bl"></div>
            </div>
            <div class="profile-name" id="profile-name">User</div>
            <div class="profile-username">@<span id="profile-username">user</span></div>
            <div class="follow-stats">
                <span><strong id="followers-count">0</strong> followers</span>
                <span><strong id="following-count">0</strong> following</span>
            </div>
            <div class="profile-points"><span>⭐</span><span id="profile-points">0 pts</span></div>
            <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                <span style="background:var(--accent-pale);color:var(--accent);padding:4px 10px;border-radius:8px;font-size:0.7rem;">📚 <span id="psessions">0</span></span>
                <span style="background:#fef3c7;color:#d97706;padding:4px 10px;border-radius:8px;font-size:0.7rem;">🔥 <span id="pstreak">0</span>j</span>
                <span style="background:#d1fae5;color:#059669;padding:4px 10px;border-radius:8px;font-size:0.7rem;">🎁 <span id="ppacks">0</span></span>
            </div>
        </div>

        <div class="card">
            <h2>🏷️ Stickers équipés (max 2)</h2>
            <div class="sticker-grid" id="equipped-stickers"></div>
            <div class="empty-state" id="no-stickers" style="display:none;"><p>Pas encore de stickers.</p></div>
        </div>

        <div class="card">
            <h2>📊 Stats</h2>
            <div class="stats-row">
                <div class="stat-card"><span class="stat-icon">📚</span><div class="stat-value" id="detail-lessons">0</div><div class="stat-label">Leçons</div></div>
                <div class="stat-card"><span class="stat-icon">✏️</span><div class="stat-value" id="detail-exercises">0</div><div class="stat-label">Exercices</div></div>
                <div class="stat-card"><span class="stat-icon">⏱️</span><div class="stat-value" id="detail-pomodoros">0</div><div class="stat-label">Pomodoros</div></div>
            </div>
        </div>

        <button class="btn-primary" style="background:var(--danger);margin-top:8px;" onclick="handleLogout()">🚪 Déconnexion</button>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
        <a href="pomodoro.html" class="nav-item"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
        <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
        <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
        <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
    </nav>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = CONFIG.SUPABASE_URL, SUPABASE_KEY = CONFIG.SUPABASE_KEY, IMGBB_KEY = CONFIG.IMGBB_API_KEY;
        let supabase = null, supabaseReady = false;
        (async function(){ try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); supabaseReady = true; } catch(e) {} })();

        const currentUser = localStorage.getItem('receiptit_logged_user');
        if (!currentUser) location.href = 'login.html';

        let state = { points:0,sessions:[],inventory:{},packsOpened:0,totalSessions:0,streak:0,packHistory:[],equippedStickers:[],avatarEmoji:'👤',profilePic:null,followers:[],following:[],userId:'user_'+Math.random().toString(36).substr(2,9)+'_'+Date.now() };

        function cacheState() { localStorage.setItem('receiptit_state_'+currentUser, JSON.stringify(state)); }
        async function saveToDB() { cacheState(); if (!supabaseReady) return; try { await supabase.from('receiptit_users').upsert({ user_id:state.userId,username:currentUser,points:state.points,sessions:state.sessions,inventory:state.inventory,packs_opened:state.packsOpened,total_sessions:state.totalSessions,streak:state.streak,pack_history:state.packHistory,equipped_stickers:state.equippedStickers,avatar_emoji:state.avatarEmoji,profile_pic:state.profilePic,followers:state.followers,following:state.following,updated_at:new Date().toISOString() },{onConflict:'username'}); } catch(e) {} }
        async function loadFromDB() { if (!supabaseReady) return false; try { const {data} = await supabase.from('receiptit_users').select('*').eq('username',currentUser).single(); if (data) { state.points=data.points||0; state.sessions=data.sessions||[]; state.inventory=data.inventory||{}; state.packsOpened=data.packs_opened||0; state.totalSessions=data.total_sessions||0; state.streak=data.streak||0; state.packHistory=data.pack_history||[]; state.equippedStickers=data.equipped_stickers||[]; state.avatarEmoji=data.avatar_emoji||'👤'; state.profilePic=data.profile_pic||null; state.followers=data.followers||[]; state.following=data.following||[]; state.userId=data.user_id||state.userId; cacheState(); return true; } } catch(e) {} const c=localStorage.getItem('receiptit_state_'+currentUser); if(c) try{state={...state,...JSON.parse(c)};}catch(e){} return false; }

        function updateUI() {
            document.getElementById('nav-points').textContent = state.points;
            document.getElementById('profile-points').textContent = state.points + ' pts';
            document.getElementById('profile-name').textContent = currentUser;
            document.getElementById('profile-username').textContent = currentUser;
            document.getElementById('followers-count').textContent = (state.followers||[]).length;
            document.getElementById('following-count').textContent = (state.following||[]).length;
            document.getElementById('psessions').textContent = state.totalSessions;
            document.getElementById('pstreak').textContent = state.streak;
            document.getElementById('ppacks').textContent = state.packsOpened;
            document.getElementById('detail-lessons').textContent = state.sessions.filter(s=>s.type==='lesson').length;
            document.getElementById('detail-exercises').textContent = state.sessions.filter(s=>s.type==='exercise').length;
            document.getElementById('detail-pomodoros').textContent = state.sessions.filter(s=>s.type==='pomodoro').length;

            if (state.profilePic) { document.getElementById('avatar-img').src=state.profilePic; document.getElementById('avatar-img').style.display='block'; document.getElementById('avatar-emoji').style.display='none'; }
            else { document.getElementById('avatar-emoji').textContent=state.avatarEmoji||'👤'; document.getElementById('avatar-img').style.display='none'; document.getElementById('avatar-emoji').style.display='block'; }

            updateEquippedStickers(); updateDecorations();
        }

        function updateEquippedStickers() {
            const container = document.getElementById('equipped-stickers');
            const items = Object.entries(state.inventory).map(([k,v]) => ({key:k,...v}));
            if (!items.length) { document.getElementById('no-stickers').style.display='block'; container.innerHTML=''; return; }
            document.getElementById('no-stickers').style.display='none';
            container.innerHTML = items.map(item => {
                const eq = (state.equippedStickers||[]).includes(item.key);
                return `<div class="sticker-item ${eq?'equipped':''}" onclick="toggleSticker('${item.key.replace(/'/g,"\\'")}')">
                    <span style="font-size:2rem;">${item.i||item.icon}</span><span class="sticker-count">${item.n||item.name}</span>
                    <span style="font-size:0.6rem;">x${item.count}</span>${eq?'<span class="equip-badge">✅</span>':''}</div>`;
            }).join('');
        }

        function toggleSticker(key) {
            if (!state.equippedStickers) state.equippedStickers = [];
            const idx = state.equippedStickers.indexOf(key);
            if (idx > -1) state.equippedStickers.splice(idx, 1);
            else { if (state.equippedStickers.length >= 2) { showToast('⚠️ Max 2 stickers !'); return; } state.equippedStickers.push(key); }
            saveToDB(); updateEquippedStickers(); updateDecorations();
        }

        function updateDecorations() {
            document.getElementById('sticker-tr').textContent = '';
            document.getElementById('sticker-bl').textContent = '';
            if (state.equippedStickers?.length > 0) { const i1 = state.inventory[state.equippedStickers[0]]; if (i1) document.getElementById('sticker-tr').textContent = i1.i||i1.icon; }
            if (state.equippedStickers?.length > 1) { const i2 = state.inventory[state.equippedStickers[1]]; if (i2) document.getElementById('sticker-bl').textContent = i2.i||i2.icon; }
        }

        async function uploadProfilePic(event) {
            const file = event.target.files[0]; if (!file) return;
            if (file.size > 5*1024*1024) { showToast('⚠️ Max 5 Mo'); return; }
            showToast('📤 Upload...');
            try {
                const fd = new FormData(); fd.append('image', file);
                const res = await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY, { method:'POST', body:fd });
                const data = await res.json();
                if (data.success) { state.profilePic = data.data.url; await saveToDB(); updateUI(); showToast('✅ Photo mise à jour !'); }
                else { showToast('❌ Erreur upload'); }
            } catch(e) { showToast('❌ Erreur'); }
        }

        function handleLogout() {
            localStorage.setItem('receiptit_last_logout_'+currentUser, new Date().toISOString());
            localStorage.removeItem('receiptit_logged_user');
            location.href = 'login.html';
        }

        function showToast(msg) { const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500); }

        document.addEventListener('DOMContentLoaded', async () => {
            const loaded = await loadFromDB();
            if (!loaded) { const c=localStorage.getItem('receiptit_state_'+currentUser); if(c) try{state={...state,...JSON.parse(c)};}catch(e){} }
            updateUI();
        });
    </script>
</body>
</html>
