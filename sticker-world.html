<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Sticker World</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="navbar">
        <div class="navbar-brand" onclick="window.location.href='index.html'" style="cursor:pointer;">RECEIPTIT</div>
        <div class="navbar-actions">
            <a href="inventory.html" class="navbar-link" title="Inventaire">🎒</a>
            <a href="sticker-world.html" class="navbar-link" title="Sticker World" style="color:var(--accent);">🌍</a>
            <a href="friends.html" class="navbar-link" title="Amis">👥</a>
            <a href="trades.html" class="navbar-link" title="Échanges">🔄</a>
            <div class="navbar-points"><span>⭐</span><span id="nav-points">0</span></div>
        </div>
    </nav>

    <div class="main-content">
        <div class="section-title">🌍 Sticker World</div>
        <p style="color:var(--text-dim);font-size:0.85rem;margin-bottom:16px;text-align:center;">Découvre les profils et suis les autres !</p>

        <div class="card" style="margin-bottom:16px;">
            <div style="display:flex;gap:8px;">
                <input type="text" id="search-input" placeholder="Rechercher un pseudo..." style="flex:1;padding:10px;border-radius:10px;border:2px solid rgba(139,92,246,0.15);font-family:'Outfit',sans-serif;font-size:0.85rem;outline:none;background:rgba(255,255,255,0.5);" oninput="renderProfiles()">
                <select id="sort-select" onchange="renderProfiles()" style="padding:10px;border-radius:10px;border:2px solid rgba(139,92,246,0.15);font-family:'Outfit',sans-serif;font-size:0.85rem;background:rgba(255,255,255,0.5);cursor:pointer;">
                    <option value="points">⭐ Points</option>
                    <option value="streak">🔥 Streak</option>
                    <option value="sessions">📚 Sessions</option>
                </select>
            </div>
        </div>

        <div id="profiles-list">
            <div class="empty-state"><div class="empty-icon">🔍</div><p>Chargement...</p></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Accueil</span></a>
        <a href="pomodoro.html" class="nav-item"><span class="nav-icon">⏱️</span><span class="nav-label">Focus</span></a>
        <a href="session.html" class="nav-item"><span class="nav-icon">➕</span><span class="nav-label">Session</span></a>
        <a href="pack.html" class="nav-item"><span class="nav-icon">🎁</span><span class="nav-label">Pack</span></a>
        <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span class="nav-label">Profil</span></a>
    </nav>

    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content" style="max-width:360px;padding:30px 24px;text-align:center;">
            <div style="position:relative;width:80px;height:80px;margin:0 auto 15px;">
                <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:white;box-shadow:var(--shadow-lg);overflow:hidden;" id="modal-avatar-container">
                    <span id="modal-avatar-emoji">👤</span>
                    <img id="modal-avatar-img" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
                </div>
                <span style="position:absolute;top:-5px;right:-5px;font-size:1.3rem;" id="modal-sticker1"></span>
                <span style="position:absolute;bottom:-5px;left:-5px;font-size:1.3rem;" id="modal-sticker2"></span>
            </div>
            <div class="modal-name" id="modal-username">@user</div>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0;">
                <span style="background:var(--accent-pale);color:var(--accent);padding:4px 10px;border-radius:8px;font-size:0.75rem;">⭐ <span id="modal-points">0</span></span>
                <span style="background:#fef3c7;color:#d97706;padding:4px 10px;border-radius:8px;font-size:0.75rem;">🔥 <span id="modal-streak">0</span>j</span>
                <span style="background:#d1fae5;color:#059669;padding:4px 10px;border-radius:8px;font-size:0.75rem;">📚 <span id="modal-sessions">0</span></span>
            </div>
            <div style="margin:16px 0;">
                <p style="font-size:0.8rem;color:var(--text-dim);font-weight:600;margin-bottom:8px;">🏷️ Stickers équipés</p>
                <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;" id="modal-stickers-list"></div>
            </div>
            <button class="btn-primary" id="modal-follow-btn" onclick="toggleFollow()" style="margin-bottom:8px;">👥 Suivre</button>
            <button class="modal-btn secondary" onclick="closeProfileModal()">Fermer</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = CONFIG.SUPABASE_URL;
        const SUPABASE_KEY = CONFIG.SUPABASE_KEY;
        let supabase = null, supabaseReady = false;
        (async function(){ try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); supabaseReady = true; } catch(e) {} })();

        const currentUser = localStorage.getItem('receiptit_logged_user');
        if (!currentUser) window.location.href = 'login.html';

        let allProfiles = [];
        let selectedProfile = null;
        let myState = { following: [], points: 0 };

        function loadMyState() {
            const s = localStorage.getItem('receiptit_state_' + currentUser);
            if (s) try { myState = { ...myState, ...JSON.parse(s) }; } catch(e) {}
        }

        function loadProfiles() {
            loadMyState();
            const users = JSON.parse(localStorage.getItem('receiptit_users') || '{}');
            allProfiles = [];
            Object.keys(users).forEach(username => {
                const stateKey = 'receiptit_state_' + username;
                const saved = localStorage.getItem(stateKey);
                if (saved) {
                    try {
                        const st = JSON.parse(saved);
                        allProfiles.push({
                            username, points: st.points || 0, totalSessions: st.totalSessions || 0,
                            streak: st.streak || 0, packsOpened: st.packsOpened || 0,
                            equippedStickers: st.equippedStickers || [], avatarEmoji: st.avatarEmoji || '👤',
                            profilePic: st.profilePic || null, inventory: st.inventory || {},
                            followers: st.followers || [], following: st.following || []
                        });
                    } catch(e) {}
                }
            });
            renderProfiles();
        }

        function renderProfiles() {
            const search = document.getElementById('search-input')?.value?.toLowerCase() || '';
            const sort = document.getElementById('sort-select')?.value || 'points';
            let filtered = allProfiles.filter(p => p.username.toLowerCase().includes(search));
            if (sort === 'points') filtered.sort((a,b) => b.points - a.points);
            if (sort === 'streak') filtered.sort((a,b) => b.streak - a.streak);
            if (sort === 'sessions') filtered.sort((a,b) => b.totalSessions - a.totalSessions);

            const container = document.getElementById('profiles-list');
            if (!filtered.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><h3>Aucun profil</h3></div>'; return; }

            container.innerHTML = filtered.map(p => {
                const isMe = p.username === currentUser;
                const stickers = (p.equippedStickers || []).slice(0, 2);
                const inv = p.inventory || {};
                return `<div class="card" style="cursor:pointer;" onclick="showProfile('${p.username}')">
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div style="position:relative;flex-shrink:0;">
                            <div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;overflow:hidden;">
                                ${p.profilePic ? `<img src="${p.profilePic}" style="width:100%;height:100%;object-fit:cover;">` : (p.avatarEmoji||'👤')}
                            </div>
                            ${stickers[0]&&inv[stickers[0]]?`<span style="position:absolute;top:-4px;right:-4px;font-size:1rem;">${inv[stickers[0]].icon}</span>`:''}
                            ${stickers[1]&&inv[stickers[1]]?`<span style="position:absolute;bottom:-4px;left:-4px;font-size:1rem;">${inv[stickers[1]].icon}</span>`:''}
                        </div>
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:700;font-size:0.9rem;">${p.username} ${isMe?'<span style="background:var(--accent-pale);color:var(--accent);padding:1px 6px;border-radius:4px;font-size:0.6rem;">TOI</span>':''}</div>
                            <div style="display:flex;gap:10px;font-size:0.7rem;color:var(--text-dim);">
                                <span>⭐ ${p.points}</span><span>🔥 ${p.streak}j</span><span>👥 ${(p.followers||[]).length}</span>
                            </div>
                        </div>
                        <span style="font-size:1.2rem;color:var(--text-light);">→</span>
                    </div>
                </div>`;
            }).join('');
        }

        function showProfile(username) {
            selectedProfile = allProfiles.find(p => p.username === username);
            if (!selectedProfile) return;
            const isMe = selectedProfile.username === currentUser;

            document.getElementById('modal-username').textContent = '@' + selectedProfile.username;
            document.getElementById('modal-points').textContent = selectedProfile.points;
            document.getElementById('modal-streak').textContent = selectedProfile.streak;
            document.getElementById('modal-sessions').textContent = selectedProfile.totalSessions;

            if (selectedProfile.profilePic) {
                document.getElementById('modal-avatar-img').src = selectedProfile.profilePic;
                document.getElementById('modal-avatar-img').style.display = 'block';
                document.getElementById('modal-avatar-emoji').style.display = 'none';
            } else {
                document.getElementById('modal-avatar-emoji').textContent = selectedProfile.avatarEmoji || '👤';
                document.getElementById('modal-avatar-img').style.display = 'none';
                document.getElementById('modal-avatar-emoji').style.display = 'block';
            }

            const stickers = selectedProfile.equippedStickers || [];
            const inv = selectedProfile.inventory || {};
            document.getElementById('modal-sticker1').textContent = stickers[0]&&inv[stickers[0]]?inv[stickers[0]].icon:'';
            document.getElementById('modal-sticker2').textContent = stickers[1]&&inv[stickers[1]]?inv[stickers[1]].icon:'';
            document.getElementById('modal-stickers-list').innerHTML = stickers.length ? stickers.map(sk => {
                const item = inv[sk];
                return item ? `<div style="text-align:center;"><span style="font-size:2rem;">${item.icon}</span><span style="font-size:0.7rem;display:block;color:var(--text-dim);">${item.name}</span></div>` : '';
            }).join('') : '<span style="font-size:0.8rem;color:var(--text-light);">Aucun sticker</span>';

            const btn = document.getElementById('modal-follow-btn');
            if (isMe) { btn.style.display = 'none'; }
            else {
                btn.style.display = 'block';
                const isFollowing = (myState.following || []).includes(selectedProfile.username);
                btn.textContent = isFollowing ? '✅ Abonné' : '👥 Suivre';
                btn.style.background = isFollowing ? 'var(--success)' : '';
            }
            document.getElementById('profile-modal').classList.add('active');
        }

        function toggleFollow() {
            if (!selectedProfile || selectedProfile.username === currentUser) return;
            const idx = (myState.following || []).indexOf(selectedProfile.username);
            if (idx > -1) { myState.following.splice(idx, 1); showToast('💔 Unfollow'); }
            else { myState.following.push(selectedProfile.username); showToast('✅ Follow !'); }
            localStorage.setItem('receiptit_state_' + currentUser, JSON.stringify({ ...JSON.parse(localStorage.getItem('receiptit_state_'+currentUser)||'{}'), following: myState.following }));
            loadProfiles();
            showProfile(selectedProfile.username);
        }

        function closeProfileModal() { document.getElementById('profile-modal').classList.remove('active'); selectedProfile = null; }
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

        document.addEventListener('DOMContentLoaded', () => { loadProfiles(); });
        document.getElementById('profile-modal').addEventListener('click', e => { if (e.target.id === 'profile-modal') closeProfileModal(); });
    </script>
</body>
</html>
