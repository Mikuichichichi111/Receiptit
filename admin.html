<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:0.7rem;font-weight:700;}.badge-success{background:#d1fae5;color:#059669;}.badge-warning{background:#fef3c7;color:#d97706;}.badge-danger{background:#fef2f2;color:#f87171;}</style>
</head>
<body>
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <nav class="navbar">
        <div class="navbar-brand">RECEIPTIT ADMIN</div>
        <button class="btn-small outline" onclick="logoutAdmin()" style="background:var(--danger-pale);border-color:var(--danger);color:var(--danger);">🚪 Quitter</button>
    </nav>

    <div class="main-content-wide">
        <div class="admin-sidebar">
            <button class="admin-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
            <button class="admin-tab" onclick="switchTab('users')">👥 Users</button>
            <button class="admin-tab" onclick="switchTab('packs')">🎁 Packs</button>
            <button class="admin-tab" onclick="switchTab('config')">⚙️ Config</button>
        </div>

        <!-- DASHBOARD -->
        <div id="tab-dashboard">
            <div class="stats-row">
                <div class="stat-card"><span class="stat-icon">👥</span><div class="stat-value" id="dash-users">0</div><div class="stat-label">Users</div></div>
                <div class="stat-card"><span class="stat-icon">📚</span><div class="stat-value" id="dash-sessions">0</div><div class="stat-label">Sessions</div></div>
                <div class="stat-card"><span class="stat-icon">🎁</span><div class="stat-value" id="dash-packs">0</div><div class="stat-label">Packs</div></div>
            </div>
            <div class="stats-row">
                <div class="stat-card"><span class="stat-icon">⭐</span><div class="stat-value" id="dash-points">0</div><div class="stat-label">Points</div></div>
                <div class="stat-card"><span class="stat-icon">🔥</span><div class="stat-value" id="dash-avgstreak">0</div><div class="stat-label">Streak moyen</div></div>
                <div class="stat-card"><span class="stat-icon">🟠</span><div class="stat-value" id="dash-legendary">0</div><div class="stat-label">Légendaires</div></div>
            </div>
            <div class="card"><h3>🕐 Dernières activités</h3><div id="dash-activity" style="font-size:0.8rem;color:var(--text-dim);">Chargement...</div></div>
        </div>

        <!-- USERS -->
        <div id="tab-users" style="display:none;">
            <div class="card">
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <input type="text" id="user-search" placeholder="Rechercher..." style="flex:1;padding:10px;border-radius:10px;border:2px solid rgba(139,92,246,0.15);font-family:'Outfit',sans-serif;font-size:0.85rem;outline:none;" oninput="renderUsers()">
                </div>
                <div style="overflow-x:auto;">
                    <table class="admin-table"><thead><tr><th>User</th><th>⭐</th><th>📚</th><th>🔥</th><th>🎁</th><th>🕐</th><th>Act.</th></tr></thead><tbody id="users-tbody"></tbody></table>
                </div>
            </div>
        </div>

        <!-- PACKS -->
        <div id="tab-packs" style="display:none;">
            <div class="card">
                <h3>🎁 Packs personnalisés</h3>
                <div id="packs-admin-list"></div>
                <button class="btn-primary" style="margin-top:12px;" onclick="document.getElementById('add-pack-form').style.display='block'">➕ Créer un pack</button>
            </div>
            <div class="card" id="add-pack-form" style="display:none;">
                <h3>Nouveau pack</h3>
                <div class="input-group"><label>Nom</label><input type="text" id="np-name" placeholder="Nom..." maxlength="30"></div>
                <div class="input-group"><label>Icône</label><input type="text" id="np-icon" placeholder="🎁" maxlength="5"></div>
                <div class="input-group"><label>Coût</label><input type="number" id="np-cost" value="100" min="1"></div>
                <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;">
                    <div><label style="font-size:0.6rem;">Com%</label><input type="number" id="np-common" value="70" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div>
                    <div><label style="font-size:0.6rem;">Rare%</label><input type="number" id="np-rare" value="20" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div>
                    <div><label style="font-size:0.6rem;">Épi%</label><input type="number" id="np-epic" value="9" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div>
                    <div><label style="font-size:0.6rem;">Lég%</label><input type="number" id="np-legendary" value="0.9" step="0.1" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div>
                    <div><label style="font-size:0.6rem;">Div%</label><input type="number" id="np-divine" value="0.1" step="0.1" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div>
                </div>
                <button class="btn-primary" onclick="addCustomPack()">✅ Créer</button>
            </div>
        </div>

        <!-- CONFIG -->
        <div id="tab-config" style="display:none;">
            <div class="card">
                <h3>⚙️ Pomodoro</h3>
                <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;">
                    <div class="input-group"><label>Focus 1</label><input type="number" id="cfg-f1" value="25"></div>
                    <div class="input-group"><label>Focus 2</label><input type="number" id="cfg-f2" value="15"></div>
                    <div class="input-group"><label>Pause courte</label><input type="number" id="cfg-sb" value="5"></div>
                    <div class="input-group"><label>Pause longue</label><input type="number" id="cfg-lb" value="15"></div>
                </div>
                <button class="btn-primary" onclick="saveConfig()">💾 Sauvegarder</button>
            </div>
            <div class="card">
                <h3>🔑 Admin password</h3>
                <div class="input-group"><label>Nouveau</label><input type="password" id="cfg-admin-pw" placeholder="..."></div>
                <button class="btn-primary" onclick="saveAdminPw()">💾 Changer</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script>
        const ADMIN_PASSWORD = CONFIG.ADMIN_PASSWORD;
        if (!localStorage.getItem('receiptit_admin_logged')) {
            const pw = prompt('🔐 Mot de passe admin :');
            if (pw !== ADMIN_PASSWORD) { alert('❌ Accès refusé'); window.location.href = 'index.html'; }
            else localStorage.setItem('receiptit_admin_logged', 'true');
        }

        function logoutAdmin() { localStorage.removeItem('receiptit_admin_logged'); window.location.href = 'index.html'; }

        function switchTab(tab) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
            ['dashboard','users','packs','config'].forEach(t => document.getElementById('tab-'+t).style.display = t === tab ? 'block' : 'none');
            if (tab === 'dashboard') loadDashboard();
            if (tab === 'users') renderUsers();
            if (tab === 'packs') renderAdminPacks();
            if (tab === 'config') loadConfig();
        }

        function getAllUsers() {
            const users = JSON.parse(localStorage.getItem('receiptit_users') || '{}');
            const all = [];
            Object.keys(users).forEach(username => {
                const s = localStorage.getItem('receiptit_state_' + username);
                let st = {};
                if (s) try { st = JSON.parse(s); } catch(e) {}
                all.push({ username, ...users[username], ...st });
            });
            return all;
        }

        function loadDashboard() {
            const all = getAllUsers();
            document.getElementById('dash-users').textContent = all.length;
            document.getElementById('dash-sessions').textContent = all.reduce((s,u) => s + (u.totalSessions||0), 0);
            document.getElementById('dash-packs').textContent = all.reduce((s,u) => s + (u.packsOpened||0), 0);
            document.getElementById('dash-points').textContent = all.reduce((s,u) => s + (u.points||0), 0);
            document.getElementById('dash-avgstreak').textContent = all.length ? (all.reduce((s,u) => s + (u.streak||0), 0) / all.length).toFixed(1) : '0';
            let leg = 0;
            all.forEach(u => { if (u.inventory) Object.values(u.inventory).forEach(i => { if (i.rarity==='legendary'||i.rarity==='divine') leg += (i.count||1); }); });
            document.getElementById('dash-legendary').textContent = leg;
            document.getElementById('dash-activity').innerHTML = all.sort((a,b) => new Date(b.lastLogin||0) - new Date(a.lastLogin||0)).slice(0,10).map(u => `<div style="padding:4px 0;">👤 @${u.username} — ⭐${u.points||0} — 🕐${u.lastLogin?new Date(u.lastLogin).toLocaleDateString('fr-FR'):'?'}</div>`).join('') || 'Aucune activité.';
        }

        function renderUsers() {
            const search = document.getElementById('user-search')?.value?.toLowerCase() || '';
            const all = getAllUsers().filter(u => u.username.toLowerCase().includes(search));
            document.getElementById('users-tbody').innerHTML = all.map(u => `
                <tr>
                    <td><strong>@${u.username}</strong></td><td>⭐${u.points||0}</td><td>📚${u.totalSessions||0}</td>
                    <td>🔥${u.streak||0}j</td><td>🎁${u.packsOpened||0}</td>
                    <td>${u.lastLogin?new Date(u.lastLogin).toLocaleDateString('fr-FR'):'-'}</td>
                    <td>
                        <button class="btn-small outline" onclick="editPoints('${u.username}',${u.points||0})">✏️</button>
                        <button class="btn-small outline" onclick="deleteUser('${u.username}')" style="border-color:var(--danger);color:var(--danger);">🗑️</button>
                    </td>
                </tr>`).join('');
        }

        function editPoints(username, pts) {
            const np = prompt('Points pour @'+username, pts);
            if (np === null) return;
            const p = parseInt(np);
            if (isNaN(p)) return;
            const stateKey = 'receiptit_state_' + username;
            const s = localStorage.getItem(stateKey);
            if (s) { const st = JSON.parse(s); st.points = p; localStorage.setItem(stateKey, JSON.stringify(st)); showToast('✅ @'+username+' → '+p+' pts'); renderUsers(); loadDashboard(); }
        }

        function deleteUser(username) {
            if (!confirm('Supprimer @'+username+' ?')) return;
            const users = JSON.parse(localStorage.getItem('receiptit_users')||'{}');
            delete users[username];
            localStorage.setItem('receiptit_users', JSON.stringify(users));
            localStorage.removeItem('receiptit_state_' + username);
            showToast('🗑️ Supprimé'); renderUsers(); loadDashboard();
        }

        function renderAdminPacks() {
            const packs = JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');
            document.getElementById('packs-admin-list').innerHTML = packs.length ? packs.map((p,i) => `<div class="card" style="display:flex;justify-content:space-between;align-items:center;"><div><strong>${p.icon} ${p.name}</strong> — ⭐${p.cost}<br><span style="font-size:0.7rem;">C:${p.probs.common}% R:${p.probs.rare}% E:${p.probs.epic}% L:${p.probs.legendary}% D:${p.probs.divine}%</span></div><button class="btn-small outline" onclick="deletePack(${i})" style="border-color:var(--danger);color:var(--danger);">🗑️</button></div>`).join('') : '<p style="color:var(--text-dim);">Aucun pack custom.</p>';
        }

        function addCustomPack() {
            const pack = {
                id: 'custom_'+Date.now(), name: document.getElementById('np-name').value||'Pack',
                icon: document.getElementById('np-icon').value||'🎁', cost: parseInt(document.getElementById('np-cost').value)||100,
                probs: { common: parseFloat(document.getElementById('np-common').value)||0, rare: parseFloat(document.getElementById('np-rare').value)||0, epic: parseFloat(document.getElementById('np-epic').value)||0, legendary: parseFloat(document.getElementById('np-legendary').value)||0, divine: parseFloat(document.getElementById('np-divine').value)||0 },
                guaranteed: null, theme: null, color: '#8b5cf6'
            };
            const packs = JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');
            packs.push(pack);
            localStorage.setItem('receiptit_custom_packs', JSON.stringify(packs));
            document.getElementById('add-pack-form').style.display = 'none';
            renderAdminPacks();
            showToast('✅ Pack créé !');
        }

        function deletePack(i) {
            const packs = JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');
            packs.splice(i,1);
            localStorage.setItem('receiptit_custom_packs', JSON.stringify(packs));
            renderAdminPacks();
        }

        function loadConfig() {
            const cfg = JSON.parse(localStorage.getItem('receiptit_config')||'{}');
            document.getElementById('cfg-f1').value = cfg.focus1 || 25;
            document.getElementById('cfg-f2').value = cfg.focus2 || 15;
            document.getElementById('cfg-sb').value = cfg.shortBreak || 5;
            document.getElementById('cfg-lb').value = cfg.longBreak || 15;
        }

        function saveConfig() {
            localStorage.setItem('receiptit_config', JSON.stringify({
                focus1: parseInt(document.getElementById('cfg-f1').value)||25,
                focus2: parseInt(document.getElementById('cfg-f2').value)||15,
                shortBreak: parseInt(document.getElementById('cfg-sb').value)||5,
                longBreak: parseInt(document.getElementById('cfg-lb').value)||15
            }));
            showToast('✅ Config sauvegardée !');
        }

        function saveAdminPw() {
            const pw = document.getElementById('cfg-admin-pw').value;
            if (!pw || pw.length < 4) { showToast('❌ Trop court'); return; }
            localStorage.setItem('receiptit_admin_password', pw);
            showToast('✅ Changé (redémarrage nécessaire)');
        }

        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

        document.addEventListener('DOMContentLoaded', () => { loadDashboard(); });
    </script>
</body>
</html>
