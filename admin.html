<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Receiptit - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>

<nav class="navbar"><div class="navbar-brand">RECEIPTIT ADMIN</div><button class="btn-small outline" onclick="logoutAdmin()" style="background:var(--danger-pale);border-color:var(--danger);color:var(--danger);">🚪 Quitter</button></nav>

<div class="main-content-wide">
    <div class="admin-sidebar">
        <button class="admin-tab active" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button class="admin-tab" onclick="switchTab('users')">👥 Users</button>
        <button class="admin-tab" onclick="switchTab('badges')">🏅 Badges</button>
        <button class="admin-tab" onclick="switchTab('stickers')">🎨 Stickers</button>
        <button class="admin-tab" onclick="switchTab('packs')">🎁 Packs</button>
        <button class="admin-tab" onclick="switchTab('config')">⚙️ Config</button>
    </div>

    <!-- DASHBOARD -->
    <div id="tab-dashboard">
        <div class="stats-row">
            <div class="stat-card"><span class="stat-icon">👥</span><div class="stat-value" id="dash-users">0</div><div class="stat-label">Users</div></div>
            <div class="stat-card"><span class="stat-icon">📚</span><div class="stat-value" id="dash-sessions">0</div><div class="stat-label">Sessions</div></div>
            <div class="stat-card"><span class="stat-icon">🎁</span><div class="stat-value" id="dash-packs">0</div><div class="stat-label">Packs</div></div>
        </div>
        <div class="stats-row">
            <div class="stat-card"><span class="stat-icon">⭐</span><div class="stat-value" id="dash-points">0</div><div class="stat-label">Points</div></div>
            <div class="stat-card"><span class="stat-icon">🔥</span><div class="stat-value" id="dash-streak">0</div><div class="stat-label">Streak moy.</div></div>
            <div class="stat-card"><span class="stat-icon">🏅</span><div class="stat-value" id="dash-badges">0</div><div class="stat-label">Badges</div></div>
        </div>
    </div>

    <!-- USERS -->
    <div id="tab-users" style="display:none;"><div class="card"><input type="text" id="user-search" placeholder="Rechercher..." style="width:100%;padding:10px;border-radius:10px;border:2px solid rgba(139,92,246,0.15);font-family:'Outfit',sans-serif;margin-bottom:12px;" oninput="renderUsers()"><div style="overflow-x:auto;"><table class="admin-table"><thead><tr><th>User</th><th>⭐</th><th>🏅</th><th>📚</th><th>🔥</th><th>Act.</th></tr></thead><tbody id="users-tbody"></tbody></table></div></div></div>

    <!-- BADGES -->
    <div id="tab-badges" style="display:none;">
        <div class="card"><h3>🏅 Badges existants</h3><div id="badges-list"></div></div>
        <div class="card"><h3>➕ Créer un badge</h3>
            <div class="input-group"><label>Nom</label><input type="text" id="badge-name" placeholder="Ex: Verified"></div>
            <div class="input-group"><label>Emoji</label><input type="text" id="badge-emoji" value="🏅" maxlength="2"></div>
            <div class="input-group"><label>Couleur</label><input type="color" id="badge-color" value="#fbbf24"></div>
            <button class="btn-primary" onclick="createBadge()">✅ Créer le badge</button>
        </div>
    </div>

    <!-- STICKERS -->
    <div id="tab-stickers" style="display:none;">
        <div class="card"><h3>🎨 Stickers personnalisés</h3><div id="stickers-list"></div></div>
        <div class="card"><h3>➕ Ajouter un sticker</h3>
            <div class="input-group"><label>Nom</label><input type="text" id="sticker-name" placeholder="Ex: Étoile d'or"></div>
            <div class="input-group"><label>Image</label><input type="file" id="sticker-file" accept="image/*"></div>
            <div class="input-group"><label>Rareté</label><select id="sticker-rarity"><option value="common">Commun</option><option value="rare">Rare</option><option value="epic">Épique</option><option value="legendary">Légendaire</option><option value="divine">Divin</option></select></div>
            <button class="btn-primary" onclick="uploadSticker()">📤 Uploader</button>
        </div>
    </div>

    <!-- PACKS -->
    <div id="tab-packs" style="display:none;"><div class="card"><h3>🎁 Packs custom</h3><div id="packs-admin-list"></div><button class="btn-primary" style="margin-top:12px;" onclick="document.getElementById('add-pack-form').style.display='block'">➕ Créer</button></div><div class="card" id="add-pack-form" style="display:none;"><h3>Nouveau pack</h3><div class="input-group"><label>Nom</label><input type="text" id="np-name" placeholder="Nom..."></div><div class="input-group"><label>Icône</label><input type="text" id="np-icon" value="🎁"></div><div class="input-group"><label>Coût</label><input type="number" id="np-cost" value="100"></div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;"><input type="number" id="np-common" value="70" placeholder="C%" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"><input type="number" id="np-rare" value="20" placeholder="R%" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"><input type="number" id="np-epic" value="9" placeholder="E%" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"><input type="number" id="np-legendary" value="0.9" step="0.1" placeholder="L%" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"><input type="number" id="np-divine" value="0.1" step="0.1" placeholder="D%" style="width:100%;padding:6px;border-radius:6px;border:1px solid #ddd;"></div><button class="btn-primary" onclick="addCustomPack()">✅ Créer</button></div></div>

    <!-- CONFIG -->
    <div id="tab-config" style="display:none;"><div class="card"><h3>⚙️ Pomodoro</h3><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"><div class="input-group"><label>Focus 1</label><input type="number" id="cfg-f1" value="25"></div><div class="input-group"><label>Focus 2</label><input type="number" id="cfg-f2" value="15"></div><div class="input-group"><label>Pause courte</label><input type="number" id="cfg-sb" value="5"></div><div class="input-group"><label>Pause longue</label><input type="number" id="cfg-lb" value="15"></div></div><button class="btn-primary" onclick="saveConfig()">💾 Sauvegarder</button></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL='https://fonraobtmkaallsjxtoj.supabase.co';
const SUPABASE_KEY='sb_publishable_QxU-Ql1Mux18PlLjGady5g_gwkTCKSH';
const IMGBB_KEY='fcf75efb4dcf86cc32df14a55969f334';
let supabase=null;
(async function(){try{supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);console.log('✅ Supabase OK');}catch(e){console.error('❌ Supabase error:',e);}})();

const ADMIN_PASSWORD='receiptit_admin_2024';
if(!localStorage.getItem('receiptit_admin_logged')){let pw=prompt('🔐 Mot de passe admin :');if(pw!==ADMIN_PASSWORD){alert('❌ Refusé');location.href='index.html';}else localStorage.setItem('receiptit_admin_logged','true');}
function logoutAdmin(){localStorage.removeItem('receiptit_admin_logged');location.href='index.html';}

let allUsers=[],allBadges=[],allStickers=[];

async function loadAll(){try{let{data:users}=await supabase.from('receiptit_users').select('*');if(users)allUsers=users;let{data:badges}=await supabase.from('receiptit_badges').select('*');if(badges)allBadges=badges;let{data:stickers}=await supabase.from('receiptit_stickers').select('*');if(stickers)allStickers=stickers;}catch(e){console.error(e);}}

function switchTab(t){
    document.querySelectorAll('.admin-tab').forEach(b=>b.classList.remove('active'));
    document.querySelector('[onclick="switchTab(\''+t+'\')"]').classList.add('active');
    ['dashboard','users','badges','stickers','packs','config'].forEach(x=>document.getElementById('tab-'+x).style.display=x===t?'block':'none');
    if(t==='dashboard')loadDashboard();if(t==='users')renderUsers();if(t==='badges')renderBadges();
    if(t==='stickers')renderStickers();if(t==='packs')renderPacks();
}

function loadDashboard(){
    document.getElementById('dash-users').textContent=allUsers.length;
    document.getElementById('dash-sessions').textContent=allUsers.reduce((s,u)=>s+(u.total_sessions||0),0);
    document.getElementById('dash-packs').textContent=allUsers.reduce((s,u)=>s+(u.packs_opened||0),0);
    document.getElementById('dash-points').textContent=allUsers.reduce((s,u)=>s+(u.points||0),0);
    document.getElementById('dash-streak').textContent=allUsers.length?(allUsers.reduce((s,u)=>s+(u.streak||0),0)/allUsers.length).toFixed(1):'0';
    document.getElementById('dash-badges').textContent=allBadges.length;
}

// ============ USERS ============
function renderUsers(){let s=document.getElementById('user-search')?.value?.toLowerCase()||'';let filtered=allUsers.filter(u=>u.username.includes(s));document.getElementById('users-tbody').innerHTML=filtered.map(u=>{let badges=(u.badges||[]).map(b=>allBadges.find(x=>x.name===b||x.id===b));return'<tr><td><strong>@'+u.username+'</strong> '+(badges.filter(b=>b).map(b=>(b.emoji||'🏅')).join(' '))+'</td><td>⭐'+(u.points||0)+'</td><td>🏅 '+(u.badges||[]).length+'</td><td>📚'+(u.total_sessions||0)+'</td><td>🔥'+(u.streak||0)+'j</td><td><button class="btn-small outline" onclick="editPoints(\''+u.username+'\','+(u.points||0)+')">✏️</button> <button class="btn-small outline" onclick="giveBadge(\''+u.username+'\')">🏅</button> <button class="btn-small outline" onclick="deleteUser(\''+u.username+'\')" style="border-color:var(--danger);color:var(--danger);">🗑️</button></td></tr>';}).join('');}

async function editPoints(u,pts){let np=prompt('Points pour @'+u,pts);if(!np)return;let p=parseInt(np);if(isNaN(p))return;try{await supabase.from('receiptit_users').update({points:p,updated_at:new Date().toISOString()}).eq('username',u);let user=allUsers.find(x=>x.username===u);if(user)user.points=p;}catch(e){}showToast('✅ @'+u+' → '+p+' pts');renderUsers();loadDashboard();}

async function deleteUser(u){if(!confirm('Supprimer @'+u+' ?'))return;try{await supabase.from('receiptit_users').delete().eq('username',u);allUsers=allUsers.filter(x=>x.username!==u);}catch(e){}showToast('🗑️ Supprimé');renderUsers();loadDashboard();}

async function giveBadge(u){let badgeNames=allBadges.map(b=>b.name).join(', ');let bn=prompt('Badge à donner à @'+u+'\nBadges dispos : '+badgeNames);if(!bn)return;let badge=allBadges.find(b=>b.name.toLowerCase()===bn.toLowerCase());if(!badge){showToast('❌ Badge introuvable');return;}let user=allUsers.find(x=>x.username===u);if(!user)return;if(!user.badges)user.badges=[];if(!user.badges.includes(badge.name))user.badges.push(badge.name);try{await supabase.from('receiptit_users').update({badges:user.badges}).eq('username',u);}catch(e){}showToast('✅ Badge '+badge.emoji+' donné à @'+u);renderUsers();}

// ============ BADGES ============
function renderBadges(){document.getElementById('badges-list').innerHTML=allBadges.length?allBadges.map(b=>'<div class="card" style="display:flex;align-items:center;gap:12px;"><span style="font-size:2rem;">'+b.emoji+'</span><div><strong>'+b.name+'</strong><br><span style="font-size:0.7rem;color:'+b.color+';">● '+b.color+'</span></div><button class="btn-small outline" onclick="deleteBadge('+b.id+')" style="border-color:var(--danger);color:var(--danger);margin-left:auto;">🗑️</button></div>').join(''):'<p style="color:var(--text-dim);">Aucun badge.</p>';}

async function createBadge(){let n=document.getElementById('badge-name').value.trim();let e=document.getElementById('badge-emoji').value;let c=document.getElementById('badge-color').value;if(!n){showToast('⚠️ Donne un nom !');return;}try{let{data,error}=await supabase.from('receiptit_badges').insert({name:n,emoji:e,color:c}).select().single();if(!error&&data){allBadges.push(data);renderBadges();showToast('✅ Badge créé !');document.getElementById('badge-name').value='';}}catch(err){console.error(err);}}

async function deleteBadge(id){if(!confirm('Supprimer ce badge ?'))return;try{await supabase.from('receiptit_badges').delete().eq('id',id);allBadges=allBadges.filter(b=>b.id!==id);renderBadges();showToast('🗑️ Badge supprimé');}catch(e){}}

// ============ STICKERS ============
function renderStickers(){document.getElementById('stickers-list').innerHTML=allStickers.length?allStickers.map(s=>'<div class="card" style="display:flex;align-items:center;gap:12px;"><img src="'+s.icon_url+'" style="width:48px;height:48px;border-radius:10px;"><div><strong>'+s.name+'</strong><br><span style="font-size:0.7rem;color:var(--text-dim);">'+s.rarity+'</span></div><button class="btn-small outline" onclick="deleteSticker('+s.id+')" style="border-color:var(--danger);color:var(--danger);margin-left:auto;">🗑️</button></div>').join(''):'<p style="color:var(--text-dim);">Aucun sticker.</p>';}

async function uploadSticker(){let n=document.getElementById('sticker-name').value.trim();let f=document.getElementById('sticker-file').files[0];let r=document.getElementById('sticker-rarity').value;if(!n||!f){showToast('⚠️ Nom + image requis');return;}let fd=new FormData();fd.append('image',f);try{let res=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});let d=await res.json();if(d.success){let{data,error}=await supabase.from('receiptit_stickers').insert({name:n,icon_url:d.data.url,rarity:r}).select().single();if(!error&&data){allStickers.push(data);renderStickers();showToast('✅ Sticker uploadé !');document.getElementById('sticker-name').value='';document.getElementById('sticker-file').value='';}}}catch(e){showToast('❌ Erreur upload');}}

async function deleteSticker(id){if(!confirm('Supprimer ?'))return;try{await supabase.from('receiptit_stickers').delete().eq('id',id);allStickers=allStickers.filter(s=>s.id!==id);renderStickers();showToast('🗑️ Supprimé');}catch(e){}}

// ============ PACKS ============
function renderPacks(){let packs=JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');document.getElementById('packs-admin-list').innerHTML=packs.length?packs.map((p,i)=>'<div class="card" style="display:flex;justify-content:space-between;align-items:center;"><div><strong>'+p.icon+' '+p.name+'</strong> — ⭐'+p.cost+'<br><span style="font-size:0.7rem;">C:'+(p.probs?.common||0)+'% R:'+(p.probs?.rare||0)+'% E:'+(p.probs?.epic||0)+'% L:'+(p.probs?.legendary||0)+'% D:'+(p.probs?.divine||0)+'%</span></div><button class="btn-small outline" onclick="deletePack('+i+')" style="border-color:var(--danger);color:var(--danger);">🗑️</button></div>').join(''):'<p style="color:var(--text-dim);">Aucun.</p>';}
function addCustomPack(){let packs=JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');packs.push({id:'custom_'+Date.now(),name:document.getElementById('np-name').value||'Pack',icon:document.getElementById('np-icon').value||'🎁',cost:parseInt(document.getElementById('np-cost').value)||100,probs:{common:parseFloat(document.getElementById('np-common').value)||0,rare:parseFloat(document.getElementById('np-rare').value)||0,epic:parseFloat(document.getElementById('np-epic').value)||0,legendary:parseFloat(document.getElementById('np-legendary').value)||0,divine:parseFloat(document.getElementById('np-divine').value)||0}});localStorage.setItem('receiptit_custom_packs',JSON.stringify(packs));document.getElementById('add-pack-form').style.display='none';renderPacks();showToast('✅ Créé !');}
function deletePack(i){let packs=JSON.parse(localStorage.getItem('receiptit_custom_packs')||'[]');packs.splice(i,1);localStorage.setItem('receiptit_custom_packs',JSON.stringify(packs));renderPacks();}

function saveConfig(){localStorage.setItem('receiptit_config',JSON.stringify({focus1:parseInt(document.getElementById('cfg-f1').value)||25,focus2:parseInt(document.getElementById('cfg-f2').value)||15,shortBreak:parseInt(document.getElementById('cfg-sb').value)||5,longBreak:parseInt(document.getElementById('cfg-lb').value)||15}));showToast('✅ Sauvegardé !');}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

document.addEventListener('DOMContentLoaded',async()=>{await loadAll();loadDashboard();});
</script>
</body>
</html>
